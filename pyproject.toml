[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qcad"
version = "2.0.0"
description = "Quantum-Classical Cyber Anomaly Detection"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.3",
    "scikit-learn>=1.7",
    "pandas>=2.3",
    "numpy>=2.2",
    "matplotlib>=3.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top — needed after warnings.filterwarnings / matplotlib.use
    "N803",   # argument name should be lowercase — ML convention: X, A, B are matrices
    "N806",   # variable in function should be lowercase — ML convention: X, K, Z are matrices
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
